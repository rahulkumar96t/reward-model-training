[project]
name = "reward-model-training"
version = "0.1.0"
description = "Pairwise reward models trained on human preference data (HelpSteer2): Bradley-Terry baselines, a small transformer reward model, and an evaluation of calibration, length bias and reward hacking probes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Neural reward model (PyTorch + transformers). Not installed by default and not used in CI.
train = [
    "torch>=2.6",
    "transformers>=5.0",
]

[project.scripts]
reward-model = "reward_model.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reward_model"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.format]
quote-style = "double"
